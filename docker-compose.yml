services:
  mongodb:
    image: mongo:7
    container_name: mini_ide_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-ide_admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-cambiar_esta_clave}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
